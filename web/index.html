<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rekap_pad_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>rekap_pad_flutter</title>
  <style>
    body {
      background-color: #1A237E;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .loading-logo {
      width: 120px;
      height: 120px;
      background-color: white;
      border-radius: 50%;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: scale 1.5s ease-out;
    }
    .loading-text {
      margin-top: 30px;
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    @keyframes scale {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="loading-logo">
      <img src="assets/assets/logokemendagri.png" width="120" height="120" alt="Kemendagri Logo">
    </div>
    <div class="loading-text">REKAP PAD</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
